name: mac

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build .app
        run: bash mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HB_AI_Smart_DNS_mac
          path: mac/build/HB_AI_Smart_DNS_mac.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" mac/build/HB_AI_Smart_DNS_mac.zip --clobber
