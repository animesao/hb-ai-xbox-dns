name: windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows Tests
        run: .\test.bat
      - name: Build Windows Executable
        run: .\build.bat
      - name: Checksum
        shell: pwsh
        run: Get-FileHash HB_AI_Xbox_DNS.exe -Algorithm SHA256
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HB_AI_Xbox_DNS
          path: HB_AI_Xbox_DNS.exe
      - name: Attach Windows to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --title "HB AI · Smart DNS ${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" HB_AI_Xbox_DNS.exe --clobber
