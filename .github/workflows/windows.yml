name: windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег релиза (например, v1.23 для публикации релиза)'
        required: false
        default: 'v1.23'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows Tests
        run: .\test.bat
      - name: Build Windows Executable
        run: .\build.bat
      - name: Checksum
        shell: pwsh
        run: Get-FileHash HB_AI_Xbox_DNS.exe -Algorithm SHA256
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HB_AI_Xbox_DNS
          path: HB_AI_Xbox_DNS.exe
      - name: Attach Windows to Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          gh release view "$TAG" || gh release create "$TAG" --title "HB AI · Smart DNS $TAG" --generate-notes
          gh release upload "$TAG" HB_AI_Xbox_DNS.exe --clobber
